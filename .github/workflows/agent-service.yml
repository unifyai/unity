name: Agent Service

# The agent-service runs on assistant VMs and user desktops; until now its
# tests only ran on developer machines. This job runs them on every change to
# the service. Full compilation stays covered by the base-image build, which
# builds magnitude first — here magnitude is cloned unbuilt purely to satisfy
# the file: dependency links, and ts-node type-checks everything the tests
# actually import.

on:
  push:
    paths:
    - "agent-service/**"
    - ".github/workflows/agent-service.yml"
  pull_request:
    paths:
    - "agent-service/**"
    - ".github/workflows/agent-service.yml"

# Reading the checkout is all this job does; the default token grants write
# scopes it never uses, which a compromised dependency in the install step
# would inherit.
permissions:
  contents: read

jobs:
  test:
    name: agent-service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Clone magnitude, unbuilt — only its dependency links are needed
      uses: actions/checkout@v4
      with:
        repository: unifyai/magnitude
        ref: main
        path: magnitude
        fetch-depth: 1

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: agent-service/package-lock.json

    - name: Install
      working-directory: agent-service
      run: npm ci

    - name: Test
      working-directory: agent-service
      run: npm test
