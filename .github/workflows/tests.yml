# NOTE: This workflow is configured for Unify's internal CI/CD.
# Fork users: this will not run without the required secrets.
# See sandboxes/conversation_manager/README.md for local development and testing.
name: Tests
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    github.event.inputs.test_path != '' &&
    format('Test {0}', github.event.inputs.test_path) ||
    github.event.head_commit.message ||
    github.event.pull_request.title
  }}

permissions:
  contents: read
  # Reading the cross-branch llm-cache-ndjson artifact.
  actions: read

on:
  # Manual trigger - always runs tests
  workflow_dispatch:
    inputs:
      test_path:
        description: "test_path: paths to test"
        required: false
        type: string
        default: "."
      confirm_full_matrix:
        description: "Type FULL_MATRIX_OK to allow test_path='.' (full suite discovery)"
        required: false
        type: string
        default: ""
      env_file_content:
        description: "env_file: paste .env contents (sensitive values masked)"
        required: false
        type: string
        default: ""
      parallel_run_args:
        description: "parallel_run_args: extra arguments (env args override env_file)"
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "timeout_minutes: session timeout"
        required: false
        type: number
        default: 120

  # Callable so the release gate can run this matrix without duplicating the
  # provisioning that already runs the tier on a staging -> main PR. The gate
  # asks for the tier by name rather than passing paths, so the list stays
  # defined in exactly one place.
  workflow_call:
    inputs:
      release_tier:
        description: "Run the deterministic release tier"
        required: false
        type: boolean
        default: false

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
    - '**'    # All branches

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
    - '**'    # All branches

# Debouncer semantics (same model as the slow-brain Debouncer): one running
# matrix per branch, one pending slot that newer runs replace.
#
# cancel-in-progress is true for pull_request AND workflow_dispatch so a
# superseded manual matrix (or a GitHub "zombie" run that ignores ordinary
# cancel) does not hold the concurrency group hostage. Push events still
# let an in-flight matrix finish — landing commits must not amputate a
# validation run mid-flight.
#
# If a run stays in_progress after ordinary cancel (cancel_requested_at
# stays null; jobs stuck on "Run tests" for tens of minutes), ordinary
# cancel is a no-op — use force-cancel:
#   gh api --method POST repos/unifyai/unify/actions/runs/<id>/force-cancel
#   # or: bash scripts/dev/force_cancel_stuck_tests.sh
#
# Without a shared group, a staging push triggers BOTH a `push`-event run
# AND (when the perpetual staging→main PR exists) a `pull_request`-event
# run for the same commit, doubling credit usage.
#
# The perpetual staging→main PR is the exception, and gets its own group.
# It runs only the release smoke tier, so sharing a group with the staging
# push meant a single-file smoke run cancelled the full matrix three
# seconds after that matrix started — the `cancel-in-progress` above is
# evaluated for the *incoming* run, so "push events let an in-flight matrix
# finish" could not hold against a PR-event run in the same group. Tagged
# pushes lost their suites silently and staging landed commits with no real
# signal. The cost of separating them is one extra smoke job per staging
# push; the cost of sharing was every matrix that push asked for.
#
# Group key uses `github.head_ref` (PR source branch) when available,
# falling back to `github.ref_name` (branch name on a direct push), so a
# feature branch's push and PR runs still dedupe against each other.
# Different branches still parallelise.
concurrency:
  group: >-
    tests-${{ github.workflow }}-${{
      (github.event_name == 'pull_request'
        && github.base_ref == 'main'
        && github.head_ref == 'staging')
      && 'release-smoke'
      || (github.head_ref || github.ref_name)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
      parallel_run_cmd: ${{ steps.check.outputs.parallel_run_cmd }}
    steps:
    - name: Check if tests should run
      id: check
      env:
        # Pass these via env to avoid shell interpretation of special chars
        # (backticks, quotes, $() in commit messages would otherwise be executed)
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REF_NAME: ${{ github.ref_name }}
        # Empty on every trigger that is not a workflow_call.
        RELEASE_TIER: ${{ inputs.release_tier }}
      run: |
        # The deterministic tier a release carries whatever else runs: fast,
        # model-free, and covering contracts every request or flow is built on.
        # Both the staging -> main PR and a direct push to staging/main resolve
        # to it, so it is named once here rather than twice below.
        #
        # test_schemas.py earns its place by generation, not by area: a tool
        # schema is assembled for every tool in every flow, and a defect there
        # is invisible to end-to-end smoke while breaking what the model is able
        # to ask for. Optional[T] collapsing to a bare T left no way to express
        # "no value", so execute_code was unusable without a venv for months
        # while the live flows stayed green.
        #
        # Keep this tier file-level. Whole directories here run 5-15 minutes
        # because they drive a local Orchestra over HTTP, and a release gate
        # measured in double-digit minutes is one people learn to route around.
        RELEASE_SMOKE_PATHS="tests/common/test_production_settings.py tests/common/test_schemas.py"

        # Helper function to extract [parallel_run.sh ...] content
        # Matches ALL occurrences and combines their arguments
        extract_parallel_cmd() {
          local msg="$1"
          local result=""
          local remaining="$msg"

          # Loop through all matches of [parallel_run.sh ...]
          while [[ "$remaining" =~ \[parallel_run\.sh[[:space:]]+([^\]]+)\] ]]; do
            local match="${BASH_REMATCH[1]}"
            # Skip literal "..." which is just documentation/example text
            if [[ "$match" != "..." ]]; then
              if [[ -n "$result" ]]; then
                result="$result $match"
              else
                result="$match"
              fi
            fi
            # Remove the matched portion and continue searching
            remaining="${remaining#*"${BASH_REMATCH[0]}"}"
          done

          if [[ -n "$result" ]]; then
            echo "$result"
          fi
        }

        # The release gate asks for the tier explicitly, and gets it whatever
        # event carried the call: a workflow_call run reports its caller's
        # event, so keying off the event name here would send a dispatched gate
        # run down the full-matrix path instead.
        if [[ "$RELEASE_TIER" == "true" ]]; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          echo "parallel_run_cmd=$RELEASE_SMOKE_PATHS" >> "$GITHUB_OUTPUT"
          echo "Release tier requested by caller"
          exit 0
        fi

        # workflow_dispatch always runs tests, but the discover job enforces
        # cost-policy guardrails before any matrix jobs are created.
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          echo "run_tests=true" >> "$GITHUB_OUTPUT"
          echo "parallel_run_cmd=" >> "$GITHUB_OUTPUT"
          echo "Tests triggered by workflow_dispatch"
          exit 0
        fi

        # For push events, check commit message
        if [[ "$EVENT_NAME" == "push" ]]; then
          # Check for [parallel_run.sh ...] first
          PARALLEL_CMD=$(extract_parallel_cmd "$COMMIT_MSG")
          if [[ -n "$PARALLEL_CMD" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=$PARALLEL_CMD" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by commit message: [parallel_run.sh $PARALLEL_CMD]"
            exit 0
          fi

          # Fall back to [run-tests]
          if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by commit message containing [run-tests]"
            exit 0
          fi

          # staging/main take direct pushes as a matter of course (see AGENTS.md
          # "commit directly to staging"), untagged. Skipping those outright would
          # leave a failed release-gate context on that commit's SHA that no later
          # staging->main PR run can outrun, since branch protection considers any
          # matching-name check run for the SHA, not just the most recent one. Give
          # them the same smoke tier as a staging->main PR rather than skipping.
          if [[ "$REF_NAME" == "staging" || "$REF_NAME" == "main" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=$RELEASE_SMOKE_PATHS" >> "$GITHUB_OUTPUT"
            echo "Smoke tests auto-triggered: direct push to $REF_NAME (release-gate safety)"
            exit 0
          fi

          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "parallel_run_cmd=" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - commit message does not contain [run-tests] or [parallel_run.sh ...]"
          exit 0
        fi

        # For pull_request events, check PR title
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          # Staging → main PRs run only a tiny smoke path by default. The full
          # LLM matrix must be triggered manually with confirm_full_matrix.
          if [[ "$PR_BASE_REF" == "main" && "$PR_HEAD_REF" == "staging" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=$RELEASE_SMOKE_PATHS" >> "$GITHUB_OUTPUT"
            echo "Smoke tests auto-triggered: staging → main PR"
            exit 0
          fi

          # Check for [parallel_run.sh ...] first
          PARALLEL_CMD=$(extract_parallel_cmd "$PR_TITLE")
          if [[ -n "$PARALLEL_CMD" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=$PARALLEL_CMD" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by PR title: [parallel_run.sh $PARALLEL_CMD]"
            exit 0
          fi

          # Fall back to [run-tests]
          if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by PR title containing [run-tests]"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "parallel_run_cmd=" >> "$GITHUB_OUTPUT"
            echo "Skipping tests - PR title does not contain [run-tests] or [parallel_run.sh ...]"
          fi
          exit 0
        fi

        # Default: don't run tests
        echo "run_tests=false" >> "$GITHUB_OUTPUT"
        echo "parallel_run_cmd=" >> "$GITHUB_OUTPUT"
        echo "Skipping tests - unknown event type"

  discover:
    runs-on: ubuntu-latest
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    outputs:
      test_dirs: ${{ steps.set-matrix.outputs.test_dirs }}
      parallel_run_args: ${{ steps.set-matrix.outputs.parallel_run_args }}
      job_timeout: ${{ steps.set-matrix.outputs.job_timeout }}
      job_timeout_matrix: ${{ steps.set-matrix.outputs.job_timeout_matrix }}
      # Project deletion flags (handled at workflow level to avoid race conditions)
      delete_on_start: ${{ steps.set-matrix.outputs.delete_on_start }}
      delete_on_exit: ${{ steps.set-matrix.outputs.delete_on_exit }}
      random_projects: ${{ steps.set-matrix.outputs.random_projects }}
      # Orchestra branch for local deployment
      orchestra_branch: ${{ steps.set-matrix.outputs.orchestra_branch }}
    steps:
    - uses: actions/checkout@v4

    - id: set-matrix
      shell: bash
      env:
        # Same reason as the should-run-tests step above: these values are
        # attacker-controlled text. parallel_run_cmd is extracted from a commit
        # message or a PR title, and the workflow_dispatch inputs are free-form
        # (env_file_content is a whole pasted .env). Interpolating any of them
        # directly into run: would execute backticks, quotes and $() they carry.
        PARALLEL_CMD_RAW: ${{ needs.should-run-tests.outputs.parallel_run_cmd }}
        INPUT_PATH_RAW: ${{ inputs.test_path }}
        INPUT_ARGS_RAW: ${{ inputs.parallel_run_args }}
        CONFIRM_FULL_MATRIX_RAW: ${{ inputs.confirm_full_matrix }}
        ENV_FILE_CONTENT_INPUT: ${{ inputs.env_file_content }}
      run: |
        # Parse test paths and flags, then create matrix entries for each path.
        # Each unique path gets its own parallel GitHub runner.
        #
        # Sources (priority order):
        # 1. [parallel_run.sh ...] from commit/PR → parse paths and flags
        # 2. workflow_dispatch inputs → test_path + parallel_run_args
        # 3. Default (no paths) → discover all leaf test folders
        #
        # ALL paths (explicit or discovered) are expanded to leaf directories:
        # - Files are kept as-is
        # - Directories are expanded to their leaf sub-folders
        #
        # Leaf discovery (Option A algorithm):
        # - Leaf directories (test files, no test subdirs) → one job per directory
        # - Mixed directories (test files AND test subdirs) → one bundled job for
        #   all direct test files (space-separated), plus recursive jobs for subdirs
        # This maximizes parallelism regardless of how paths are specified.

        PARALLEL_CMD="$PARALLEL_CMD_RAW"
        INPUT_PATH="$INPUT_PATH_RAW"
        INPUT_ARGS="$INPUT_ARGS_RAW"
        CONFIRM_FULL_MATRIX="$CONFIRM_FULL_MATRIX_RAW"
        EVENT_NAME="${{ github.event_name }}"
        ENV_FILE_CONTENT_RAW="$ENV_FILE_CONTENT_INPUT"
        ENV_FILE_CONTENT=""

        if [[ -n "$ENV_FILE_CONTENT_RAW" ]]; then
          if DECODED=$(echo "$ENV_FILE_CONTENT_RAW" | base64 -d 2>/dev/null) && [[ "$DECODED" == *$'\n'* || "$DECODED" == *"="* ]]; then
            ENV_FILE_CONTENT="$DECODED"
          else
            ENV_FILE_CONTENT="$ENV_FILE_CONTENT_RAW"
          fi
        fi

        # Initialize
        declare -a RAW_PATHS=()
        declare -a PATHS=()
        declare -a FLAGS=()

        if [[ -n "$PARALLEL_CMD" ]]; then
          # Parse [parallel_run.sh ...] from commit/PR message
          # Separate flags (--env, --eval-only, etc.) from paths
          echo "Parsing [parallel_run.sh $PARALLEL_CMD]" >&2
          LAST_FLAG=""
          for token in $PARALLEL_CMD; do
            if [[ "$token" == -* ]]; then
              # It's a flag - collect it and its value if needed
              FLAGS+=("$token")
              LAST_FLAG="$token"
            elif [[ "$LAST_FLAG" == "--env" || "$LAST_FLAG" == "-e" || "$LAST_FLAG" == "--tags" || "$LAST_FLAG" == "-j" || "$LAST_FLAG" == "--jobs" || "$LAST_FLAG" == "-t" || "$LAST_FLAG" == "--timeout" || "$LAST_FLAG" == "--session-timeout" || "$LAST_FLAG" == "--repeat" ]]; then
              # Previous token was a flag that takes a value
              FLAGS+=("$token")
              LAST_FLAG=""
            else
              # It's a path - collect for expansion
              RAW_PATHS+=("$token")
              LAST_FLAG=""
            fi
          done
        elif [[ -n "$INPUT_PATH" && "$INPUT_PATH" != "." ]]; then
          # workflow_dispatch with specific path(s)
          # Split space-separated paths into array
          read -ra RAW_PATHS <<< "$INPUT_PATH"
          # Flags come from parallel_run_args input
          if [[ -n "$INPUT_ARGS" ]]; then
            read -ra FLAGS <<< "$INPUT_ARGS"
          fi
          echo "Using test_path input: ${RAW_PATHS[*]}" >&2
        fi

        # A marker-filtered run has to discover only the paths carrying those
        # tests. parallel_run.sh treats a shard whose filter selects nothing as
        # a hard error, so handing the whole suite to any of these filters fails
        # every job sitting entirely on the other side of it.
        DISCOVERY_FLAGS=()
        for marker_flag in --eval-only --symbolic-only --deterministic-only; do
          if [[ " ${FLAGS[*]-} $INPUT_ARGS " == *" $marker_flag "* ]]; then
            DISCOVERY_FLAGS+=("$marker_flag")
          fi
        done

        # Expand paths to leaf directories using discover_test_paths.py
        # - If RAW_PATHS is empty, discover all test paths from tests/
        # - If RAW_PATHS has entries, expand each directory to its leaf sub-folders
        # This ensures maximum parallelism regardless of how paths are specified.
        if (( ${#RAW_PATHS[@]} == 0 )); then
          # No explicit paths - discover all
          while IFS= read -r path; do
            PATHS+=("$path")
          done < <(python3 .github/scripts/discover_test_paths.py ${DISCOVERY_FLAGS[@]+"${DISCOVERY_FLAGS[@]}"})
          # Flags come from parallel_run_args input (if any)
          if [[ -n "$INPUT_ARGS" ]]; then
            read -ra FLAGS <<< "$INPUT_ARGS"
          fi
          echo "Discovered ${#PATHS[@]} test paths (leaf dirs + individual files)" >&2
        else
          # Expand explicit paths to their leaf directories
          while IFS= read -r path; do
            PATHS+=("$path")
          done < <(python3 .github/scripts/discover_test_paths.py ${DISCOVERY_FLAGS[@]+"${DISCOVERY_FLAGS[@]}"} "${RAW_PATHS[@]}")
          echo "Expanded ${#RAW_PATHS[@]} path(s) to ${#PATHS[@]} leaf test paths" >&2
        fi

        # Build JSON array of paths for matrix
        if (( ${#PATHS[@]} == 0 )); then
          echo "Error: No test paths found" >&2
          exit 1
        fi

        cost_policy_fail() {
          echo "" >&2
          echo "Refusing to create an expensive LLM test matrix." >&2
          echo "Reason: $1" >&2
          echo "" >&2
          echo "Safe options:" >&2
          echo "  - Target a narrow path, e.g. [parallel_run.sh tests/contact_manager/test_ask.py]" >&2
          echo "  - For the full suite, use workflow_dispatch with test_path='.' and confirm_full_matrix='FULL_MATRIX_OK'." >&2
          echo "  - For uncached/cache-refresh evals, use the protected LLM Cache Refresh workflow." >&2
          exit 1
        }

        full_matrix_confirmed=false
        if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CONFIRM_FULL_MATRIX" == "FULL_MATRIX_OK" ]]; then
          full_matrix_confirmed=true
        fi

        if (( ${#RAW_PATHS[@]} == 0 )) && ! $full_matrix_confirmed; then
          cost_policy_fail "no explicit test path was provided, which would discover the full suite"
        fi

        # tests/flows are live-LLM smoke tests: their conftest forces the brain
        # to run uncached (it flips UNILLM_CACHE off whenever UNILLM_CACHE_DIR is
        # unset, as it is here), so they cannot honor this workflow's read-only
        # cost guard and would make silent paid calls. They run instead on the
        # dedicated, spend-acknowledged Flow Smoke workflow.
        for _p in "${PATHS[@]}"; do
          if [[ "$_p" == *tests/flows* ]]; then
            cost_policy_fail "tests/flows run live LLM calls; use the Flow Smoke workflow (.github/workflows/flow-smoke.yml), not normal CI"
          fi
        done

        check_cost_sensitive_flags() {
          local -n _flags_ref=$1
          local i flag next_val
          for i in "${!_flags_ref[@]}"; do
            flag="${_flags_ref[$i]}"
            next_val="${_flags_ref[$((i+1))]:-}"
            case "$flag" in
              --env|-e)
                case "$next_val" in
                  UNILLM_CACHE=read-only)
                    ;;
                  UNILLM_CACHE=*)
                    cost_policy_fail "normal CI may not override UNILLM_CACHE (got '$next_val')"
                    ;;
                esac
                ;;
              --repeat)
                if [[ "$next_val" =~ ^[0-9]+$ && "$next_val" -gt 1 ]]; then
                  cost_policy_fail "normal CI may not use --repeat $next_val"
                fi
                ;;
              --repeat=*)
                repeat_value="${flag#--repeat=}"
                if [[ "$repeat_value" =~ ^[0-9]+$ && "$repeat_value" -gt 1 ]]; then
                  cost_policy_fail "normal CI may not use --repeat $repeat_value"
                fi
                ;;
              --env=UNILLM_CACHE=*|-e=UNILLM_CACHE=*)
                cost_policy_fail "normal CI may not override UNILLM_CACHE (got '$flag')"
                ;;
            esac
          done
        }

        check_cost_sensitive_flags FLAGS

        json=$(printf '%s\n' "${PATHS[@]}" | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "test_dirs=$json" >> "$GITHUB_OUTPUT"
        echo "Matrix paths: $json" >&2

        # =====================================================================
        # Process project management flags with correct precedence:
        # 1. CI defaults (lowest priority)
        # 2. env_file_content (middle priority - can override defaults)
        # 3. parallel_run_args/FLAGS (highest priority - overrides everything)
        #
        # Note: env_file_content is base64-encoded and will be decoded/written
        # to .env in the pytest job. We only parse it here for project mgmt flags.
        # =====================================================================

        # CI defaults for project management (can be overridden)
        # With local orchestra (default), these are ignored - each job has fresh DB
        # Only relevant when ORCHESTRA_URL is set to a non-local URL (staging/production)
        DELETE_ON_START="false"  # Default: no deletion (local orchestra has fresh DB)
        DELETE_ON_EXIT="false"   # Default: keep project after tests
        RANDOM_PROJECTS="false"  # Default: shared project mode

        # Orchestra branch precedence (highest to lowest):
        # 1. --env LOCAL_ORCHESTRA_BRANCH=xxx (handled below in FLAGS parsing)
        # 2. env_file_content LOCAL_ORCHESTRA_BRANCH=xxx (handled below)
        # 3. Repository variable LOCAL_ORCHESTRA_BRANCH (if set)
        # 4. Auto-detect from unity branch (main→main, otherwise→staging)
        REPO_VAR_BRANCH="${{ vars.LOCAL_ORCHESTRA_BRANCH }}"
        if [[ -n "$REPO_VAR_BRANCH" ]]; then
          ORCHESTRA_BRANCH="$REPO_VAR_BRANCH"
          echo "Orchestra branch from repo variable: $ORCHESTRA_BRANCH" >&2
        else
          UNIFY_BRANCH="${{ github.ref_name }}"
          if [[ "$UNIFY_BRANCH" == "main" ]]; then
            ORCHESTRA_BRANCH="main"
          else
            ORCHESTRA_BRANCH="staging"
          fi
          echo "Orchestra branch auto-detected: $ORCHESTRA_BRANCH (unity on '$UNIFY_BRANCH')" >&2
        fi

        # Parse env_file_content for project management flags only
        # (actual env vars are written to .env in pytest job, not passed as --env args)
        if [[ -n "$ENV_FILE_CONTENT_RAW" ]]; then
          echo "Parsing env_file_content for project management flags..." >&2
          if [[ -n "$ENV_FILE_CONTENT" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              # Skip empty lines and comments
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

              # Extract KEY=VALUE (handles quotes)
              if [[ "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=[[:space:]]*(.*)[[:space:]]*$ ]]; then
                key="${BASH_REMATCH[1]}"
                value="${BASH_REMATCH[2]}"

                # Strip surrounding quotes if present
                if [[ "$value" =~ ^\"(.*)\"$ ]] || [[ "$value" =~ ^\'(.*)\'$ ]]; then
                  value="${BASH_REMATCH[1]}"
                fi

                # Only check for project management flags (other vars handled via .env file)
                case "$key=$value" in
                  UNIFY_TESTS_DELETE_PROJ_ON_START=true|UNIFY_TESTS_DELETE_PROJ_ON_START=True|UNIFY_TESTS_DELETE_PROJ_ON_START=1)
                    DELETE_ON_START="true"
                    echo "  env_file: DELETE_ON_START=true" >&2
                    ;;
                  UNIFY_TESTS_DELETE_PROJ_ON_START=false|UNIFY_TESTS_DELETE_PROJ_ON_START=False|UNIFY_TESTS_DELETE_PROJ_ON_START=0)
                    DELETE_ON_START="false"
                    echo "  env_file: DELETE_ON_START=false" >&2
                    ;;
                  UNIFY_TESTS_DELETE_PROJ_ON_EXIT=true|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=True|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=1)
                    DELETE_ON_EXIT="true"
                    echo "  env_file: DELETE_ON_EXIT=true" >&2
                    ;;
                  UNIFY_TESTS_DELETE_PROJ_ON_EXIT=false|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=False|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=0)
                    DELETE_ON_EXIT="false"
                    echo "  env_file: DELETE_ON_EXIT=false" >&2
                    ;;
                  UNIFY_TESTS_RAND_PROJ=true|UNIFY_TESTS_RAND_PROJ=True|UNIFY_TESTS_RAND_PROJ=1)
                    RANDOM_PROJECTS="true"
                    echo "  env_file: RANDOM_PROJECTS=true" >&2
                    ;;
                  UNIFY_TESTS_RAND_PROJ=false|UNIFY_TESTS_RAND_PROJ=False|UNIFY_TESTS_RAND_PROJ=0)
                    RANDOM_PROJECTS="false"
                    echo "  env_file: RANDOM_PROJECTS=false" >&2
                    ;;
                  LOCAL_ORCHESTRA_BRANCH=*)
                    ORCHESTRA_BRANCH="$value"
                    echo "  env_file: ORCHESTRA_BRANCH=$value" >&2
                    ;;
                esac
              fi
            done <<< "$ENV_FILE_CONTENT"
          fi
        fi

        # Process FLAGS (from parallel_run_args) - highest priority
        # These are explicit --env args passed via commit message or workflow dispatch
        declare -a CLEANED_FLAGS=()
        skip_next=false

        for i in "${!FLAGS[@]}"; do
          if $skip_next; then
            skip_next=false
            continue
          fi

          flag="${FLAGS[$i]}"
          next_val="${FLAGS[$((i+1))]:-}"

          # Check for --env with project management flags (strip them, handle at workflow level)
          if [[ "$flag" == "--env" ]]; then
            case "$next_val" in
              UNIFY_TESTS_DELETE_PROJ_ON_START=true|UNIFY_TESTS_DELETE_PROJ_ON_START=True|UNIFY_TESTS_DELETE_PROJ_ON_START=1)
                DELETE_ON_START="true"
                skip_next=true
                echo "  args: DELETE_ON_START=true (override)" >&2
                continue
                ;;
              UNIFY_TESTS_DELETE_PROJ_ON_START=false|UNIFY_TESTS_DELETE_PROJ_ON_START=False|UNIFY_TESTS_DELETE_PROJ_ON_START=0)
                DELETE_ON_START="false"
                skip_next=true
                echo "  args: DELETE_ON_START=false (override)" >&2
                continue
                ;;
              UNIFY_TESTS_DELETE_PROJ_ON_EXIT=true|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=True|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=1)
                DELETE_ON_EXIT="true"
                skip_next=true
                echo "  args: DELETE_ON_EXIT=true (override)" >&2
                continue
                ;;
              UNIFY_TESTS_DELETE_PROJ_ON_EXIT=false|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=False|UNIFY_TESTS_DELETE_PROJ_ON_EXIT=0)
                DELETE_ON_EXIT="false"
                skip_next=true
                echo "  args: DELETE_ON_EXIT=false (override)" >&2
                continue
                ;;
              UNIFY_TESTS_RAND_PROJ=true|UNIFY_TESTS_RAND_PROJ=True|UNIFY_TESTS_RAND_PROJ=1)
                RANDOM_PROJECTS="true"
                CLEANED_FLAGS+=("$flag" "$next_val")  # Keep for runners
                skip_next=true
                echo "  args: RANDOM_PROJECTS=true (override)" >&2
                continue
                ;;
              UNIFY_TESTS_RAND_PROJ=false|UNIFY_TESTS_RAND_PROJ=False|UNIFY_TESTS_RAND_PROJ=0)
                RANDOM_PROJECTS="false"
                skip_next=true
                echo "  args: RANDOM_PROJECTS=false (override)" >&2
                continue
                ;;
              LOCAL_ORCHESTRA_BRANCH=*)
                ORCHESTRA_BRANCH="${next_val#LOCAL_ORCHESTRA_BRANCH=}"
                skip_next=true
                echo "  args: ORCHESTRA_BRANCH=${ORCHESTRA_BRANCH} (override)" >&2
                continue
                ;;
            esac
          fi

          CLEANED_FLAGS+=("$flag")
        done

        echo "" >&2
        echo "Final settings:" >&2
        echo "  DELETE_ON_START=$DELETE_ON_START" >&2
        echo "  DELETE_ON_EXIT=$DELETE_ON_EXIT" >&2
        echo "  RANDOM_PROJECTS=$RANDOM_PROJECTS" >&2

        echo "delete_on_start=$DELETE_ON_START" >> "$GITHUB_OUTPUT"
        echo "delete_on_exit=$DELETE_ON_EXIT" >> "$GITHUB_OUTPUT"
        echo "random_projects=$RANDOM_PROJECTS" >> "$GITHUB_OUTPUT"
        echo "orchestra_branch=$ORCHESTRA_BRANCH" >> "$GITHUB_OUTPUT"

        # Build parallel_run_args from explicit flags only (not env_file content)
        # env_file content is handled separately by writing to .env on the runner
        if (( ${#CLEANED_FLAGS[@]} > 0 )); then
          flags_str="${CLEANED_FLAGS[*]}"
          echo "parallel_run_args=$flags_str" >> "$GITHUB_OUTPUT"
          echo "Explicit args: $flags_str" >&2
        else
          echo "parallel_run_args=" >> "$GITHUB_OUTPUT"
        fi

        # Compute job timeout (test timeout + 10 min buffer)
        BASE_TIMEOUT="${{ inputs.timeout_minutes }}"
        if [[ -z "$BASE_TIMEOUT" || "$BASE_TIMEOUT" == "null" ]]; then
          BASE_TIMEOUT=120
        fi
        JOB_TIMEOUT=$((BASE_TIMEOUT + 10))
        echo "job_timeout=$JOB_TIMEOUT" >> "$GITHUB_OUTPUT"
        echo "job_timeout_matrix=[$JOB_TIMEOUT]" >> "$GITHUB_OUTPUT"

  # Setup job: runs ONCE before all pytest jobs (if delete_on_start is true)
  # Handles project deletion at workflow level to avoid race conditions
  setup:
    name: Setup
    runs-on: ubuntu-latest
    needs: [should-run-tests, discover]
    # Only run if DELETE_ON_START is requested AND we're in shared project mode
    if: |
      needs.should-run-tests.outputs.run_tests == 'true' &&
      needs.discover.outputs.delete_on_start == 'true' &&
      needs.discover.outputs.random_projects != 'true'
    env:
      UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
      # No fallback - if delete_on_start is enabled, ORCHESTRA_URL must be set
      ORCHESTRA_URL: ${{ vars.ORCHESTRA_URL }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Clone unisdk client
      uses: actions/checkout@v4
      with:
        repository: unifyai/unisdk
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unisdk
        submodules: false
        fetch-depth: 1

    - name: Install unisdk client
      run: pip install -e ./unisdk

    - name: Delete shared project (once, before all runners)
      run: |
        echo "Deleting shared project before tests start..."
        python3 << 'PYEOF'
        import os
        import unisdk

        project_name = os.environ.get("UNISDK_PROJECT", "UnityTests")
        try:
            unisdk.delete_project(project_name)
            print(f"✓ Deleted project '{project_name}'")
        except Exception as e:
            print(f"Note: Could not delete project '{project_name}': {e}")
            print("(Project may not exist yet - this is OK)")
        PYEOF

  pytest:
    name: pytest (${{ matrix.test_path }})
    runs-on: ubuntu-latest-8-cores
    environment: unity-testing
    # Wall-clock cap = timeout_minutes input + 10 min buffer on workflow_dispatch,
    # else 130 min for push/PR. discover computes job_timeout; matrix.job_timeout
    # carries it here because needs.discover.outputs and '+' are unusable directly.
    timeout-minutes: ${{ matrix.job_timeout }}
    # Depend on setup job (it may be skipped, but that's OK - GitHub handles this)
    needs: [should-run-tests, discover, setup]
    if: |
      always() &&
      needs.should-run-tests.outputs.run_tests == 'true' &&
      (needs.setup.result == 'success' || needs.setup.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        test_path: ${{ fromJSON(needs.discover.outputs.test_dirs) }}
        job_timeout: ${{ fromJSON(needs.discover.outputs.job_timeout_matrix) }}
    env:
      # CI project management defaults (explicit, not relying on code defaults)
      UNIFY_TESTS_RAND_PROJ: "false"              # Shared project mode
      UNIFY_TESTS_DELETE_PROJ_ON_START: "false"   # Handled by setup job at workflow level
      UNIFY_TESTS_DELETE_PROJ_ON_EXIT: "false"    # Keep project after tests
      # Normal CI must fail closed on cache misses. Real LLM cache refreshes
      # are isolated in the protected LLM Cache Refresh workflow. Canonical
      # keying lets recordings survive mundane prompt churn (block reordering,
      # docstring rewording, volatile substrings); byte-identical re-recording
      # is an explicit refresh-workflow decision, not a CI requirement.
      UNILLM_CACHE: "read-only"
      UNILLM_CACHE_KEYING: "canonical"
      # Local orchestra path (cloned into workspace, not sibling directory)
      ORCHESTRA_REPO_PATH: ${{ github.workspace }}/orchestra
      # Coordinator local-stack tests need unify-deploy/selfhost/stack.sh when
      # auto-managed; without a full self-host stack in CI they should skip.
      UNIFY_DEPLOY_REPO_PATH: ${{ github.workspace }}/unify-deploy
      LOCAL_STACK_NO_AUTO: "1"
      # API credentials
      # ORCHESTRA_URL: if repo variable set, use remote; otherwise local orchestra sets it
      ORCHESTRA_URL: ${{ vars.ORCHESTRA_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_CI_API_KEY }}
      # The brain (unillm) routes LLM calls through OpenRouter; without this the
      # slow-brain turns fail with a 401 "No cookie auth credentials found".
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
      # Together BYOK is registered on the OpenRouter workspace that owns this
      # key; expose TOGETHER_API_KEY for Together-pinned MiniMax/etc. traffic.
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      # Orchestra routes embeddings (embed() derived logs / Builtins seeding)
      # through OpenRouter, so the CI-local Orchestra needs this key too.
      ORCHESTRA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CI_API_KEY }}
      # UNIFY_COMMS_URL stays unset: it keeps the in-process
      # LocalActivationScheduler on and outbound comms off the hosted
      # Communication service (see unify/task_scheduler/settings.py).
      # Orchestra GCP configuration (set by google-github-actions/auth step)
      # GOOGLE_APPLICATION_CREDENTIALS is set automatically by the google-github-actions/auth action
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      # GCP bucket names (passed to orchestra server)
      ORCHESTRA_GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_LOGS }}
      ORCHESTRA_GCP_ASSISTANT_MEDIA_BUCKET_NAME: ${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}
      ORCHESTRA_GCP_ASSISTANT_CALL_RECORDINGS_BUCKET_NAME: ${{ vars.GCP_BUCKET_RECORDINGS }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Unify API key for _prepare_shared_project.py and tests
      UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
      # The Builtins project is reserved (admin-key-only) in Orchestra. The
      # fresh CI-local Orchestra (host uvicorn, inherits this env) adopts this
      # as its admin key, and the test Builtins seed uses the same value so it
      # can create/converge the reserved project. Local-only throwaway key.
      ORCHESTRA_ADMIN_KEY: local-admin-key
      # Ensure local unillm/unify packages are found correctly
      # The repos are cloned to ./unillm/ and ./unisdk/, with packages inside
      PYTHONPATH: ${{ github.workspace }}/unillm:${{ github.workspace }}/unisdk
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # Mints an installation token that can read orchestra and nothing
    # else, then revokes it when the job ends. 4606137 is the
    # unifyai-ci-clone App, which holds Contents: Read only; an App id is
    # not a secret.
    - name: Mint a token that can read orchestra
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: orchestra

    - name: Clone orchestra repo for local deployment
      uses: actions/checkout@v4
      with:
        repository: unifyai/orchestra
        ref: ${{ needs.discover.outputs.orchestra_branch }}
        path: orchestra
        token: ${{ steps.clone-token.outputs.token }}
        fetch-depth: 1

    - name: Clone unify repo
      uses: actions/checkout@v4
      with:
        repository: unifyai/unisdk
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unisdk
        fetch-depth: 1

    - name: Clone unillm repo
      uses: actions/checkout@v4
      with:
        repository: unifyai/unillm
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unillm
        fetch-depth: 1

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    - name: Get orchestra commit SHA
      id: orchestra-sha
      run: echo "sha=$(git -C orchestra rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Setup environment from env_file_content
      if: inputs.env_file_content != ''
      env:
        # Free-form input (a whole pasted .env), so it reaches the shell through
        # the environment rather than being interpolated into the script text.
        ENV_FILE_CONTENT_INPUT: ${{ inputs.env_file_content }}
      run: |
        # Write env_file_content to .env, handling both base64-encoded and raw formats
        # - parallel_cloud_run.sh sends base64-encoded content
        # - Manual UI paste can be raw .env content (more convenient)
        CONTENT="$ENV_FILE_CONTENT_INPUT"

        # Try to decode as base64; if it fails or produces binary garbage, assume raw content
        if DECODED=$(echo "$CONTENT" | base64 -d 2>/dev/null) && [[ "$DECODED" == *$'\n'* || "$DECODED" == *"="* ]]; then
          ENV_CONTENT="$DECODED"
          echo "✓ Decoded base64 env_file_content"
        else
          ENV_CONTENT="$CONTENT"
          echo "✓ Using raw env_file_content"
        fi

        # Normal CI owns cache mode and provider credentials at job level.
        # Filter any local developer values before parallel_run.sh sources .env.
        printf '%s\n' "$ENV_CONTENT" > .env.raw
        python3 << 'PYEOF'
        from pathlib import Path
        import sys

        blocked = {
            "UNILLM_CACHE",
            "OPENAI_API_KEY",
            "ANTHROPIC_API_KEY",
            "OPENROUTER_API_KEY",
            "GROQ_API_KEY",
            "MISTRAL_API_KEY",
            "GOOGLE_API_KEY",
            "GEMINI_API_KEY",
        }

        output = []
        for line in Path(".env.raw").read_text().splitlines(keepends=True):
            stripped = line.lstrip()
            if stripped and not stripped.startswith("#") and "=" in stripped:
                key = stripped.split("=", 1)[0].strip()
                if key in blocked:
                    print(
                        f"Removed {key} from env_file_content; CI uses guarded job-level values.",
                        file=sys.stderr,
                    )
                    continue
            output.append(line)

        Path(".env").write_text("".join(output))
        PYEOF
        rm .env.raw

        # Mask values for sensitive variable names (these patterns catch most secrets)
        # Sensitive patterns: *_KEY, *_SECRET, *_PASSWORD, *_TOKEN, *_CREDENTIAL*, *_API_*
        while IFS= read -r line || [[ -n "$line" ]]; do
          # Skip empty lines and comments
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

          # Extract KEY=VALUE
          if [[ "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=[[:space:]]*(.*)[[:space:]]*$ ]]; then
            key="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"

            # Strip surrounding quotes if present
            if [[ "$value" =~ ^\"(.*)\"$ ]] || [[ "$value" =~ ^\'(.*)\'$ ]]; then
              value="${BASH_REMATCH[1]}"
            fi

            # Skip empty values
            [[ -z "$value" ]] && continue

            # Mask if key matches sensitive patterns
            key_upper="${key^^}"
            if [[ "$key_upper" == *_KEY || "$key_upper" == *_SECRET || \
                  "$key_upper" == *_PASSWORD || "$key_upper" == *_TOKEN || \
                  "$key_upper" == *_CREDENTIAL* || "$key_upper" == *_API_* || \
                  "$key_upper" == *APIKEY* ]]; then
              # Skip values shorter than 4 characters to avoid catastrophic masking
              # (e.g. a value of "3" would replace every digit 3 with *** everywhere)
              if (( ${#value} >= 4 )); then
                echo "::add-mask::$value"
                echo "Masked: $key"
              else
                echo "Skipped masking $key (value too short: ${#value} chars)"
              fi
            fi
          fi
        done < .env

        echo "✓ Environment file written to .env (sensitive values masked)"

    - name: Normalize test path
      id: normalize-path
      run: |
        # Each matrix entry is either a single test path or a space-separated
        # bundle of files (from mixed directories with both files and subdirs)
        RAW_PATH='${{ matrix.test_path }}'
        echo "test_args=$RAW_PATH" >> $GITHUB_OUTPUT

        # Normalize for artifact naming and display.
        # Artifact names cannot contain : " < > | * ? \ / or newlines.
        if [[ "$RAW_PATH" == *" "* ]]; then
          # Bundled multi-file entry: derive name from common parent directory
          first_file="${RAW_PATH%% *}"
          parent_dir=$(dirname "$first_file")
          file_count=$(echo "$RAW_PATH" | wc -w | tr -d ' ')
          normalized=$(echo "$parent_dir" | sed 's|^tests/||' | tr '/' '_')
          normalized="${normalized}_${file_count}_files"
          display_name="${parent_dir} (${file_count} files)"
        else
          normalized=$(echo "$RAW_PATH" | sed 's|^tests/||' | tr '/:' '__' | tr ' ' '_')
          display_name="$RAW_PATH"
        fi

        # Strip remaining characters forbidden by actions/upload-artifact
        # (and keep names filesystem-agnostic like llm-cache-refresh).
        normalized=$(echo "$normalized" | tr -cd '[:alnum:]_-' | cut -c1-120)
        if [[ -z "$normalized" || "$normalized" == "." ]]; then normalized="all"; fi
        echo "test_path_normalized=$normalized" >> $GITHUB_OUTPUT
        echo "display_name=$display_name" >> $GITHUB_OUTPUT

        # Calculate timeout in seconds (default 120 minutes)
        TIMEOUT_MINS="${{ inputs.timeout_minutes }}"
        if [[ -z "$TIMEOUT_MINS" || "$TIMEOUT_MINS" == "null" ]]; then
          TIMEOUT_MINS=120
        fi
        echo "timeout_seconds=$((TIMEOUT_MINS * 60))" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install apt packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          tmux zsh portaudio19-dev libnss3-dev libatk-bridge2.0-dev libdrm2 \
          libxkbcommon0 libgtk-3-dev libgbm-dev libgirepository1.0-dev \
          libasound2t64 libatspi2.0-0 libgtk-3-0 libnspr4 libwayland-client0 \
          libxcomposite1 libxdamage1 libxrandr2 xvfb

    - name: Install uv
      run: |
        pip install uv

    # Cache uv dependencies to avoid re-downloading on every run.
    # Only the download cache is stored, never .venv: uv rebuilds the
    # environment from it by hardlink in seconds, whereas caching both stored
    # every dependency twice and made this the largest object in the repo's
    # Actions cache. It is saved on every ref, so the duplication crowded out
    # the shared .cache.ndjson and left read-only LLM tests with no cache at
    # all. Keep this path list to what cannot be reconstructed locally.
    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        # v2 marks the drop of .venv. Without a new prefix the existing entries
        # still match on an unchanged dependency hash, and a cache hit does not
        # re-save, so the old two-copy archives would survive until a dependency
        # moved. Include unillm and unify pyproject.toml to bust the cache when
        # dependencies change.
        key: uv-v2-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'unillm/pyproject.toml', 'unisdk/pyproject.toml') }}
        restore-keys: |
          uv-v2-${{ runner.os }}-

    - name: Configure unify/unillm paths for CI
      run: |
        # The checked-out dependency repos live in the workflow workspace, so
        # point uv at those paths instead of refetching Git sources.
        python3 <<'PY'
        from pathlib import Path

        pyproject = Path("pyproject.toml")
        text = pyproject.read_text()
        replacements = {
            'unisdk = { git = "https://github.com/unifyai/unisdk.git", branch = "staging" }': 'unisdk = { path = "./unisdk", editable = true }',
            'unillm = { git = "https://github.com/unifyai/unillm.git", branch = "staging" }': 'unillm = { path = "./unillm", editable = true }',
            'unisdk = { path = "../unisdk", editable = true }': 'unisdk = { path = "./unisdk", editable = true }',
            'unillm = { path = "../unillm", editable = true }': 'unillm = { path = "./unillm", editable = true }',
        }
        for old, new in replacements.items():
            text = text.replace(old, new)
        pyproject.write_text(text)

        unillm_pyproject = Path("unillm/pyproject.toml")
        text = unillm_pyproject.read_text()
        text = text.replace(
            'unisdk = { git = "https://github.com/unifyai/unisdk.git", branch = "staging" }',
            'unisdk = { path = "../unisdk", editable = true }',
        )
        unillm_pyproject.write_text(text)
        PY

    - name: Sync dependencies with uv
      run: |
        # Install project and dev dependencies from pyproject.toml
        uv sync --all-groups

    - name: Verify local packages installed correctly
      run: |
        # Ensure we got the LOCAL unillm/unify, not PyPI packages with the same name
        # The local unillm exports AsyncUnify; the PyPI one exports UniLLM
        # PYTHONPATH is set at job level to include ./unillm and ./unify
        uv run python -c "
        import sys
        print('Python path (first 5):')
        for p in sys.path[:5]:
            print(f'  {p}')

        from unillm import AsyncUnify, Unify
        import unisdk

        print(f'✓ unillm: {AsyncUnify.__module__}')
        print(f'✓ unisdk: {unisdk.__file__}')
        assert hasattr(unisdk, 'create_project'), f'Wrong unisdk package!'
        print('✓ Local packages verified successfully')
        "

    # Cache Playwright assets (~500MB) to avoid re-downloading on every run
    - name: Cache Playwright assets
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright assets
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        uv run playwright install --with-deps

    # =========================================================================
    # HuggingFace model cache (any tests under tests/file_manager/ —
    # both `managers/` and `file_parser/` exercise docling's PDF pipeline,
    # which downloads the docling-project/docling-models weights on first
    # use). Without a stable cache, every CI run does a fresh multi-GB
    # download into /tmp/unity_test_home/.cache/huggingface (set by
    # tests/conftest.py's HOME isolation), and the chunked-download temp
    # dirs race with each other across parallel pytest workers →
    # "[Errno 2] No such file or directory: '.../tmp_<uuid>'" mid-
    # download → pdf_backend parse failure. Originally observed in
    # file_manager/managers (test_parse_multiple_mixed,
    # test_filter_by_content_id_dict); same race subsequently surfaced
    # in file_manager/file_parser (test_document_formats_have_text_
    # summary_metadata_and_structure[*.pdf-pdf-pdf_backend]). Broaden
    # the gate so any matrix entry under tests/file_manager/ is covered.
    #
    # Caching ~/.cache/huggingface (the original $HOME location) makes
    # unify/tests/conftest.py:pytest_configure() honor its HF_HOME-preserve
    # branch (which only fires when ~/.cache/huggingface exists on the
    # original HOME), pointing the test process at the warm cache instead
    # of a fresh /tmp dir. After the first successful CI run populates the
    # cache, subsequent runs are race-free for these tests.
    # =========================================================================
    - name: Cache HuggingFace models (file_manager tests)
      if: contains(matrix.test_path, 'file_manager/')
      id: hf-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        # Key version (v1) — bump if docling/HF model set changes and we
        # want to force a fresh download across all CI runs.
        key: huggingface-docling-${{ runner.os }}-v1
        restore-keys: |
          huggingface-docling-${{ runner.os }}-

    - name: Pre-download docling models (cache miss)
      if: contains(matrix.test_path, 'file_manager/') && steps.hf-cache.outputs.cache-hit != 'true'
      run: |
        # First-time download into the cached path. Running once here,
        # serialized before the test matrix forks, eliminates the parallel
        # download race that breaks tests in the cold-cache case.
        mkdir -p ~/.cache/huggingface
        uv run python -c "
        from docling.document_converter import DocumentConverter
        DocumentConverter()  # triggers model download into ~/.cache/huggingface
        print('docling models warmed')
        "

    # =========================================================================
    # Agent-service setup (only for tests/agent_service/ matrix entries)
    # Installs Node.js, clones magnitude, builds magnitude-core, and installs
    # agent-service npm deps + Patchright browser binaries.
    # =========================================================================
    - name: Setup Node.js (agent-service tests)
      if: contains(matrix.test_path, 'agent_service')
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Clone magnitude repo (agent-service tests)
      if: contains(matrix.test_path, 'agent_service')
      uses: actions/checkout@v4
      with:
        repository: unifyai/magnitude
        ref: main
        path: magnitude
        fetch-depth: 1

    - name: Install bun (agent-service tests, magnitude packageManager dep)
      if: contains(matrix.test_path, 'agent_service')
      run: |
        # magnitude's root package.json declares
        # "packageManager": "bun@1.2.8^". Turbo (run by the monorepo's
        # postinstall script) reads packageManager to pick which package
        # manager to invoke for workspace builds. Without bun on PATH,
        # turbo dies with:
        #   "Unable to find package manager binary: cannot find binary path"
        # Install bun globally via npm so turbo's lookup succeeds.
        npm install -g bun
        bun --version

    - name: Build magnitude packages and install agent-service (agent-service tests)
      if: contains(matrix.test_path, 'agent_service')
      run: |
        # Build magnitude as a TURBOREPO MONOREPO from its root.
        #
        # Previously this step did `cd magnitude/packages/magnitude-core;
        # npm install` which fails with `sh: 1: turbo: not found` —
        # because magnitude's root package.json declares
        # `"postinstall": "turbo run build"` and `turbo` is a root-level
        # devDep (`turbo: ^2.4.4`). Installing in a workspace subdir
        # triggers the root postinstall hook BEFORE the root has
        # downloaded its own devDeps, so the postinstall can't find
        # turbo on PATH.
        #
        # Installing from the monorepo root with npm workspaces:
        #   1. Downloads root devDeps including turbo
        #   2. Resolves & installs all workspace packages
        #   3. Runs the root postinstall (`turbo run build`) which now
        #      finds turbo via node_modules/.bin and builds all
        #      packages in the right dependency order
        cd magnitude
        npm install
        echo "✓ magnitude monorepo installed + built via turbo postinstall"

        # Install agent-service dependencies
        cd ${{ github.workspace }}/agent-service
        npm install
        echo "✓ agent-service dependencies installed"

        # Install Patchright browser (Chromium) for Level 2 round-trip tests.
        #
        # `patchright` is declared as a magnitude root-level devDep
        # (magnitude/package.json: "patchright": "^1.52.5") — NOT as an
        # agent-service dep — so the binary lives at
        # magnitude/node_modules/.bin/patchright. Running `npx
        # patchright install chromium` from agent-service/ resolves npx
        # against agent-service/node_modules and exits 127
        # ("sh: 1: patchright: not found"). Run it from magnitude/ where
        # patchright is actually installed.
        cd ${{ github.workspace }}/magnitude
        npx patchright install chromium
        echo "✓ Patchright Chromium installed"

    - name: Restore .cache.ndjson
      id: cache-read
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    # Only on a miss. The Actions cache is the hot layer and lives beside the
    # runner, so a hit must not pay for a repo-wide artifact download; but it is
    # branch-scoped and evictable, and read-only mode fails closed the moment it
    # is absent. See the script for the branch-scoping detail.
    - name: Hydrate .cache.ndjson from the cross-branch artifact
      if: steps.cache-read.outputs.cache-matched-key == ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: .github/scripts/hydrate_llm_cache.sh

    # Cache orchestra's virtualenv keyed on orchestra's commit SHA
    - name: Cache orchestra virtualenv
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/orchestra/.venv
        key: uv-orchestra-${{ runner.os }}-${{ steps.orchestra-sha.outputs.sha }}
        restore-keys: |
          uv-orchestra-${{ runner.os }}-

    - name: Install orchestra dependencies
      run: |
        # Install orchestra dependencies so parallel_run.sh can start it
        # (parallel_run.sh handles the full orchestra lifecycle)
        cd "$ORCHESTRA_REPO_PATH"
        uv sync --frozen

    - name: Run tests
      id: run-tests
      run: |
        set +e

        # parallel_run_args comes from discover job (parsed from commit message or inputs)
        EXTRA_ARGS="${{ needs.discover.outputs.parallel_run_args }}"
        TEST_PATH="${{ steps.normalize-path.outputs.test_args }}"
        TIMEOUT="${{ steps.normalize-path.outputs.timeout_seconds }}"

        # Start Xvfb manually instead of using xvfb-run.
        # xvfb-run doesn't propagate signals to child processes, making
        # workflow cancellation ineffective. This approach ensures SIGTERM
        # reaches parallel_run.sh directly.
        Xvfb :99 -screen 0 1920x1080x24 &
        XVFB_PID=$!
        export DISPLAY=:99

        # Ensure Xvfb is cleaned up on exit
        trap "kill $XVFB_PID 2>/dev/null" EXIT

        # parallel_run.sh handles starting local orchestra automatically
        # Note: TEST_PATH must come before EXTRA_ARGS because EXTRA_ARGS may contain
        # "-- pytest-args" and everything after -- is treated as pytest arguments
        # TEST_PATH is unquoted to allow word splitting for bundled multi-file entries
        echo "Running: parallel_run.sh --timeout $TIMEOUT --session-timeout 1800 $TEST_PATH $EXTRA_ARGS"
        # shellcheck disable=SC2086
        tests/parallel_run.sh --timeout "$TIMEOUT" --session-timeout 1800 $TEST_PATH $EXTRA_ARGS
        TEST_EXIT_CODE=$?
        echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit $TEST_EXIT_CODE

    - name: Dump orchestra logs on failure
      if: failure()
      run: |
        echo "=== Orchestra Server Logs ==="
        if [ -f /tmp/orchestra-local-server.log ]; then
          cat /tmp/orchestra-local-server.log
          # Copy to logs/orchestra/ so it gets uploaded with artifacts
          mkdir -p logs/orchestra
          cp /tmp/orchestra-local-server.log logs/orchestra/server.log
          echo "(Copied to logs/orchestra/server.log for artifact upload)"
        else
          echo "No orchestra log file found at /tmp/orchestra-local-server.log"
        fi
        echo ""
        echo "=== Orchestra Server Process Status ==="
        if [ -f /tmp/orchestra-local-server.pid ]; then
          PID=$(cat /tmp/orchestra-local-server.pid)
          echo "Expected PID: $PID"
          if ps -p "$PID" > /dev/null 2>&1; then
            echo "Process is still running"
          else
            echo "Process is NOT running"
          fi
        else
          echo "No PID file found"
        fi
        echo ""
        echo "=== Any orchestra-related processes ==="
        ps aux | grep -E "(orchestra|uvicorn)" | grep -v grep || echo "None found"

    - name: Generate failure summary
      if: failure()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

        # Count total tests from log files (robust - doesn't depend on tmux session timing)
        TOTAL_COUNT=0
        if [ -d "logs/pytest" ]; then
          TOTAL_COUNT=$(find logs/pytest -name "*.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
        fi

        # Get failed sessions from tmux (these persist, unlike passing sessions which auto-close)
        FAILED_SESSIONS=""
        FAIL_COUNT=0
        for sock in /tmp/tmux-$(id -u)/unity*; do
          if [ -S "$sock" ]; then
            socket_name=$(basename "$sock")
            FAILED_SESSIONS=$(tmux -L "$socket_name" ls 2>/dev/null | sed 's/: .*//' | grep '^f ' || true)
            FAIL_COUNT=$(echo "$FAILED_SESSIONS" | grep -c '^f ' || echo 0)
            break
          fi
        done

        # Infer passes from total - failures (robust to timing of session auto-close)
        PASS_COUNT=$((TOTAL_COUNT - FAIL_COUNT))

        # Echo to step output (foldable view)
        echo "=== Test Results ==="
        echo "✅ $PASS_COUNT passed, ❌ $FAIL_COUNT failed"
        echo ""
        echo "Failed tests:"
        echo "$FAILED_SESSIONS"
        echo ""
        echo "Download logs: $ARTIFACTS_URL"

        # Write to GitHub Summary page
        echo "## ❌ Test Failures: \`${{ steps.normalize-path.outputs.display_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ $PASS_COUNT** passed, **❌ $FAIL_COUNT** failed — [view logs]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Failed tests:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "$FAILED_SESSIONS" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        # Include duration and cache summary if available
        DURATION_FILE=$(find logs/pytest -name "duration_summary.txt" 2>/dev/null | head -1)
        if [ -n "$DURATION_FILE" ] && [ -f "$DURATION_FILE" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📊 Test Stats: Duration & Cache (fastest → slowest)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat "$DURATION_FILE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Generate success summary
      if: success()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

        # Count test files
        log_count=0
        if [ -d "logs/pytest" ]; then
          log_count=$(find logs/pytest -name "*.txt" -type f 2>/dev/null | wc -l | tr -d ' ')
        fi

        # Fail if no tests ran - this indicates a problem (path resolution, collection error, etc.)
        if [ "$log_count" -eq 0 ]; then
          echo "## ⚠️ No Tests Ran: \`${{ steps.normalize-path.outputs.display_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**0 tests executed** — this likely indicates a problem with test discovery." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the 'Run tests' step logs for details." >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Error: No tests were executed. This indicates a problem with test discovery." >&2
          echo "Check the 'Run tests' step output for pytest collection errors." >&2
          exit 1
        fi

        # Echo to step output (foldable view)
        echo "=== All tests passed ==="
        echo "✅ $log_count passed"
        echo ""
        echo "View logs: $ARTIFACTS_URL"

        # Write to GitHub Summary page
        echo "## ✅ All Tests Passed: \`${{ steps.normalize-path.outputs.display_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ $log_count** passed — [view logs]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

        # Include duration and cache summary if available
        DURATION_FILE=$(find logs/pytest -name "duration_summary.txt" 2>/dev/null | head -1)
        if [ -n "$DURATION_FILE" ] && [ -f "$DURATION_FILE" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📊 Test Stats: Duration & Cache (fastest → slowest)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat "$DURATION_FILE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        fi

    # =========================================================================
    # Artifact uploads - run BEFORE cleanup to ensure logs are always available
    # Even if cleanup fails, we want the debugging artifacts uploaded
    # =========================================================================
    - name: Upload cache artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cache-diff-${{ github.run_id }}-${{ steps.normalize-path.outputs.test_path_normalized }}
        path: .cache_write.ndjson
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 1

    # =========================================================================
    # Stop orchestra BEFORE log upload to ensure all PENDING trace files are
    # finalized. Orchestra writes in-flight requests as *_PENDING_*.json and
    # renames them on completion. If orchestra is still running during upload,
    # the glob may find PENDING files that get renamed before upload reads them.
    # =========================================================================
    - name: Stop local orchestra (before log upload)
      if: always()
      continue-on-error: true  # Cleanup failures shouldn't affect job status
      run: |
        trap 'echo "Received SIGTERM, exiting gracefully"; exit 0' TERM
        orchestra/scripts/local.sh stop || true

    - name: Prepare logs for upload
      if: always()
      run: |
        # Prepare each log subfolder independently with isolated error handling.
        # If one log type has issues, others should still be uploadable.
        # The logs/ directory mirrors the artifact structure: pytest, llm, orchestra.

        echo "=== Preparing logs for upload ==="

        # Ensure logs directory exists (even if empty, artifact upload handles this)
        mkdir -p logs

        # --- pytest logs ---
        if [ -d logs/pytest ]; then
          file_count=$(find logs/pytest -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ pytest logs: $file_count files"
        else
          echo "○ pytest logs: directory not found (skipping)"
        fi

        # --- Unillm logs ---
        if [ -d logs/unillm ]; then
          file_count=$(find logs/unillm -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ unillm logs: $file_count files"
        else
          echo "○ unillm logs: directory not found (skipping)"
        fi

        # --- Orchestra logs (requires filename sanitization) ---
        if [ -d logs/orchestra ]; then
          # Orchestra trace filenames include route paths which may contain colons
          # (e.g., project_name:path). Colons are invalid in Windows NTFS, so
          # GitHub Actions rejects them. Replace invalid characters with underscores.
          sanitized=0
          while IFS= read -r -d '' file; do
            newname=$(echo "$file" | tr ':' '_')
            if mv "$file" "$newname" 2>/dev/null; then
              ((sanitized++)) || true
            fi
          done < <(find logs/orchestra -type f -name '*:*' -print0 2>/dev/null || true)

          file_count=$(find logs/orchestra -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$sanitized" -gt 0 ]; then
            echo "✓ orchestra logs: $file_count files ($sanitized filenames sanitized)"
          else
            echo "✓ orchestra logs: $file_count files"
          fi
        else
          echo "○ orchestra logs: directory not found (skipping)"
        fi

        echo "=== Log preparation complete ==="

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ steps.normalize-path.outputs.test_path_normalized }}
        path: logs/
        if-no-files-found: ignore
        retention-days: 14

    # =========================================================================
    # Cleanup steps - run AFTER artifact uploads
    # Note: Orchestra is stopped BEFORE log upload (see above) to ensure
    # PENDING trace files are finalized. This section handles tmux cleanup.
    # =========================================================================
    - name: Cleanup on cancellation
      if: cancelled()
      run: |
        echo "Workflow cancelled - cleaning up tmux sessions and orphaned processes..."
        # Kill all unity tmux servers and purge orphaned test processes
        tests/kill_server.sh --all || true
        # Orchestra already stopped before log upload, but ensure it's down
        orchestra/scripts/local.sh stop || true
        echo "Cleanup complete."

  # Cleanup job: runs ONCE after all pytest jobs complete or are cancelled
  # Handles project deletion at workflow level to avoid race conditions
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [should-run-tests, discover, pytest]
    # Run if: (delete_on_exit requested in shared mode) OR (any job was cancelled)
    # Cancelled runs likely left partial test data that should be cleaned up
    if: |
      always() &&
      needs.should-run-tests.outputs.run_tests == 'true' &&
      needs.discover.outputs.random_projects != 'true' &&
      (needs.discover.outputs.delete_on_exit == 'true' || needs.pytest.result == 'cancelled')
    env:
      UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
      # No fallback - if delete_on_exit is enabled, ORCHESTRA_URL must be set
      ORCHESTRA_URL: ${{ vars.ORCHESTRA_URL }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Clone unisdk client
      uses: actions/checkout@v4
      with:
        repository: unifyai/unisdk
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unisdk
        submodules: false
        fetch-depth: 1

    - name: Install unisdk client
      run: pip install -e ./unisdk

    - name: Delete shared project (once, after all runners)
      run: |
        echo "Deleting shared project after all tests complete..."
        python3 << 'PYEOF'
        import os
        import unisdk

        project_name = os.environ.get("UNISDK_PROJECT", "UnityTests")
        try:
            unisdk.delete_project(project_name)
            print(f"✓ Deleted project '{project_name}'")
        except Exception as e:
            print(f"Note: Could not delete project '{project_name}': {e}")
        PYEOF

  cache-consolidation:
    name: Consolidate and store cache
    runs-on: ubuntu-latest
    needs: [should-run-tests, pytest, cleanup]
    if: false
    steps:
    - run: echo "Normal CI runs with UNILLM_CACHE=read-only and never writes the shared cache."
