name: LLM Cache Refresh
run-name: LLM cache refresh ${{ inputs.test_path }}

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Path(s) to refresh/evaluate (space-separated); '.' for full suite"
        required: true
        type: string
      parallel_run_args:
        description: "Extra parallel_run.sh args; do not set UNILLM_CACHE here"
        required: false
        type: string
        default: ""
      cache_mode:
        description: "write-misses refreshes cache; uncached-eval bypasses cache"
        required: true
        type: choice
        default: write-misses
        options:
        - write-misses
        - uncached-eval
      keying:
        description: "canonical spends only on real drift; exact re-records byte-identical misses"
        required: false
        type: choice
        default: canonical
        options:
        - canonical
        - exact
      timeout_minutes:
        description: "Per-matrix-job session timeout"
        required: false
        type: number
        default: 120
      max_parallel:
        description: "Max concurrent matrix refresh jobs"
        required: false
        type: number
        default: 20
      confirm_llm_spend:
        description: "Type LLM_SPEND_OK to acknowledge this may call paid LLM APIs"
        required: true
        type: string
      confirm_full_matrix:
        description: "Type FULL_MATRIX_OK to allow test_path='.'"
        required: false
        type: string
        default: ""
      confirm_repeat:
        description: "Type REPEAT_OK to allow --repeat N where N > 1"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# One refresh campaign per branch. Inside a campaign, the matrix parallelizes.
# Debouncer semantics: let the running refresh finish; only the pending slot
# is replaced when a newer dispatch lands.
concurrency:
  group: llm-cache-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate spend controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Validate spend controls
      shell: bash
      env:
        # Free-form dispatch inputs: reach the shell through the environment so
        # backticks, quotes and $() in them are data, not script.
        TEST_PATH_INPUT: ${{ inputs.test_path }}
        EXTRA_ARGS_INPUT: ${{ inputs.parallel_run_args }}
      run: |
        TEST_PATH="$TEST_PATH_INPUT"
        EXTRA_ARGS="$EXTRA_ARGS_INPUT"

        fail() {
          echo "Refusing protected LLM run: $1" >&2
          exit 1
        }

        [[ -n "$TEST_PATH" ]] || fail "test_path is required"
        # CONSOLIDATE_FROM:<run_id> skips paid refresh and only merges that
        # run's cache-diff artifacts into the shared Actions cache.
        if [[ "$TEST_PATH" == CONSOLIDATE_FROM:* ]]; then
          RUN_ID="${TEST_PATH#CONSOLIDATE_FROM:}"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || fail "CONSOLIDATE_FROM requires a numeric run id"
          [[ "${{ inputs.cache_mode }}" == "write-misses" ]] || fail "CONSOLIDATE_FROM requires cache_mode=write-misses"
          echo "Consolidate-only mode from run $RUN_ID"
          exit 0
        fi
        # EXPORT_CACHE restores the shared Actions .cache.ndjson and uploads
        # it as an artifact for local sync (no LLM spend).
        if [[ "$TEST_PATH" == "EXPORT_CACHE" ]]; then
          echo "Export-only mode: restore shared cache and upload artifact"
          exit 0
        fi

        [[ "${{ inputs.confirm_llm_spend }}" == "LLM_SPEND_OK" ]] || fail "confirm_llm_spend must be LLM_SPEND_OK"
        if [[ "$TEST_PATH" == "." ]]; then
          [[ "${{ inputs.confirm_full_matrix }}" == "FULL_MATRIX_OK" ]] || fail "test_path='.' requires confirm_full_matrix=FULL_MATRIX_OK"
        fi
        read -ra ARG_TOKENS <<< "$EXTRA_ARGS"
        for i in "${!ARG_TOKENS[@]}"; do
          token="${ARG_TOKENS[$i]}"
          next="${ARG_TOKENS[$((i+1))]:-}"
          repeat_value=""
          if [[ "$token" == "--repeat" ]]; then
            repeat_value="$next"
          elif [[ "$token" == --repeat=* ]]; then
            repeat_value="${token#--repeat=}"
          fi
          if [[ "$repeat_value" =~ ^[0-9]+$ && "$repeat_value" -gt 1 ]]; then
            [[ "${{ inputs.confirm_repeat }}" == "REPEAT_OK" ]] || fail "--repeat N where N > 1 requires confirm_repeat=REPEAT_OK"
          fi
        done
        if [[ "$EXTRA_ARGS" == *"UNILLM_CACHE="* ]]; then
          fail "this workflow owns UNILLM_CACHE through cache_mode"
        fi

  discover:
    name: Discover matrix
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    outputs:
      test_dirs: ${{ steps.set-matrix.outputs.test_dirs }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - id: set-matrix
      shell: bash
      env:
        # Free-form dispatch inputs: see the validate job above.
        TEST_PATH_INPUT: ${{ inputs.test_path }}
        EXTRA_ARGS_INPUT: ${{ inputs.parallel_run_args }}
      run: |
        TEST_PATH="$TEST_PATH_INPUT"
        EXTRA_ARGS="$EXTRA_ARGS_INPUT"
        declare -a RAW_PATHS=()
        declare -a PATHS=()

        if [[ "$TEST_PATH" == CONSOLIDATE_FROM:* || "$TEST_PATH" == "EXPORT_CACHE" ]]; then
          # Placeholder matrix value; refresh job is skipped in these modes.
          echo 'test_dirs=["__consolidate_only__"]' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Recording a marker's corpus means dispatching this with that marker's
        # flag, so discovery has to narrow to the paths carrying those tests: a
        # shard whose filter selects nothing is a hard error in parallel_run.sh.
        DISCOVERY_FLAGS=()
        for marker_flag in --eval-only --symbolic-only --deterministic-only; do
          if [[ " $EXTRA_ARGS " == *" $marker_flag "* ]]; then
            DISCOVERY_FLAGS+=("$marker_flag")
          fi
        done

        if [[ "$TEST_PATH" == "." ]]; then
          while IFS= read -r path; do
            PATHS+=("$path")
          done < <(python3 .github/scripts/discover_test_paths.py ${DISCOVERY_FLAGS[@]+"${DISCOVERY_FLAGS[@]}"})
        else
          read -ra RAW_PATHS <<< "$TEST_PATH"
          while IFS= read -r path; do
            PATHS+=("$path")
          done < <(python3 .github/scripts/discover_test_paths.py ${DISCOVERY_FLAGS[@]+"${DISCOVERY_FLAGS[@]}"} "${RAW_PATHS[@]}")
        fi

        # Flows fill the shared cache from their own workflow: flow-smoke.yml
        # runs them read-write and consolidates each session's writes itself.
        # Their per-session cache dirs also do not match the .cache_write.ndjson
        # this workflow uploads, so refreshing them here would spend and collect
        # nothing.
        FILTERED=()
        for _p in "${PATHS[@]}"; do
          if [[ "$_p" == *tests/flows* ]]; then
            echo "Skipping path that manages its own cache: $_p" >&2
            continue
          fi
          FILTERED+=("$_p")
        done
        PATHS=("${FILTERED[@]}")

        if (( ${#PATHS[@]} == 0 )); then
          echo "Error: no refreshable test paths after filtering" >&2
          exit 1
        fi

        echo "Matrix entries (${#PATHS[@]}):" >&2
        printf '  %s\n' "${PATHS[@]}" >&2

        python3 - <<'PY' "${PATHS[@]}"
        import json, os, sys
        paths = sys.argv[1:]
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"test_dirs={json.dumps(paths)}\n")
        PY

  refresh:
    name: refresh (${{ matrix.test_path }})
    runs-on: ubuntu-latest-8-cores
    needs: [validate, discover]
    if: ${{ !startsWith(inputs.test_path, 'CONSOLIDATE_FROM:') && inputs.test_path != 'EXPORT_CACHE' }}
    environment: unity-llm-cache-refresh
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        test_path: ${{ fromJSON(needs.discover.outputs.test_dirs) }}
    env:
      UNIFY_TESTS_RAND_PROJ: "false"
      UNIFY_TESTS_DELETE_PROJ_ON_START: "false"
      UNIFY_TESTS_DELETE_PROJ_ON_EXIT: "false"
      UNILLM_CACHE: ${{ inputs.cache_mode == 'uncached-eval' && 'false' || 'true' }}
      UNILLM_CACHE_KEYING: ${{ inputs.keying }}
      ORCHESTRA_REPO_PATH: ${{ github.workspace }}/orchestra
      UNIFY_DEPLOY_REPO_PATH: ${{ github.workspace }}/unify-deploy
      LOCAL_STACK_NO_AUTO: "1"
      ORCHESTRA_URL: ${{ vars.ORCHESTRA_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_CI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      ORCHESTRA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CI_API_KEY }}
      # UNIFY_COMMS_URL stays unset: it keeps the in-process
      # LocalActivationScheduler on and outbound comms off the hosted
      # Communication service (see unify/task_scheduler/settings.py).
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      ORCHESTRA_GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_LOGS }}
      ORCHESTRA_GCP_ASSISTANT_MEDIA_BUCKET_NAME: ${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}
      ORCHESTRA_GCP_ASSISTANT_CALL_RECORDINGS_BUCKET_NAME: ${{ vars.GCP_BUCKET_RECORDINGS }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
      ORCHESTRA_ADMIN_KEY: local-admin-key
      PYTHONPATH: ${{ github.workspace }}/unillm:${{ github.workspace }}/unisdk
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Normalize test path for artifacts
      id: normalize-path
      shell: bash
      run: |
        RAW_PATH='${{ matrix.test_path }}'
        normalized=$(echo "$RAW_PATH" | tr '/ *' '___' | tr -cd '[:alnum:]_-' | cut -c1-80)
        echo "test_path_normalized=$normalized" >> "$GITHUB_OUTPUT"

    # Mints an installation token that can read orchestra and nothing
    # else, then revokes it when the job ends. 4606137 is the
    # unifyai-ci-clone App, which holds Contents: Read only; an App id is
    # not a secret.
    - name: Mint a token that can read orchestra
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: orchestra

    - name: Clone orchestra repo for local deployment
      uses: actions/checkout@v4
      with:
        repository: unifyai/orchestra
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: orchestra
        token: ${{ steps.clone-token.outputs.token }}
        fetch-depth: 1

    - name: Clone unisdk repo
      uses: actions/checkout@v4
      with:
        repository: unifyai/unisdk
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unisdk
        fetch-depth: 1

    - name: Clone unillm repo
      uses: actions/checkout@v4
      with:
        repository: unifyai/unillm
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unillm
        fetch-depth: 1

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2.1.13
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install apt packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          tmux zsh portaudio19-dev libnss3-dev libatk-bridge2.0-dev libdrm2 \
          libxkbcommon0 libgtk-3-dev libgbm-dev libgirepository1.0-dev \
          libasound2t64 libatspi2.0-0 libgtk-3-0 libnspr4 libwayland-client0 \
          libxcomposite1 libxdamage1 libxrandr2 xvfb

    - name: Install uv
      run: |
        pip install uv

    - name: Configure local package paths
      run: |
        sed -i 's|path = "../unisdk"|path = "./unisdk"|g' pyproject.toml
        sed -i 's|path = "../unillm"|path = "./unillm"|g' pyproject.toml

    - name: Sync dependencies with uv
      run: uv sync --all-groups

    - name: Install Playwright assets
      run: uv run playwright install --with-deps

    - name: Install orchestra dependencies
      run: |
        cd "$ORCHESTRA_REPO_PATH"
        uv sync --frozen

    - name: Restore existing consolidated cache
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    - name: Run protected LLM tests
      id: run-tests
      shell: bash
      env:
        # matrix.test_path is derived from the test_path input, so it carries the
        # same free-form text; route all three through the environment.
        TIMEOUT_MINUTES_INPUT: ${{ inputs.timeout_minutes }}
        TEST_PATH_INPUT: ${{ matrix.test_path }}
        EXTRA_ARGS_INPUT: ${{ inputs.parallel_run_args }}
      run: |
        set +e
        TIMEOUT=$(( ${TIMEOUT_MINUTES_INPUT:-30} * 60 ))
        TEST_PATH="$TEST_PATH_INPUT"
        EXTRA_ARGS="$EXTRA_ARGS_INPUT"

        Xvfb :99 -screen 0 1920x1080x24 &
        XVFB_PID=$!
        export DISPLAY=:99
        trap "kill $XVFB_PID 2>/dev/null" EXIT

        echo "Running protected LLM shard with UNILLM_CACHE=$UNILLM_CACHE path=$TEST_PATH"
        # Uncached LLM sessions can legitimately exceed the normal CI 30m
        # per-session default; cap at 60m (or just under the job budget).
        SESSION_TIMEOUT=3600
        if (( SESSION_TIMEOUT >= TIMEOUT )); then
          if (( TIMEOUT > 60 )); then
            SESSION_TIMEOUT=$(( TIMEOUT - 60 ))
          else
            SESSION_TIMEOUT=$TIMEOUT
          fi
        fi
        # shellcheck disable=SC2086
        tests/parallel_run.sh --timeout "$TIMEOUT" --session-timeout "$SESSION_TIMEOUT" $TEST_PATH $EXTRA_ARGS
        TEST_EXIT_CODE=$?
        echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit $TEST_EXIT_CODE

    - name: Upload cache diff
      # Fail-closed: a shard that did not pass records nothing. Cache entries
      # carry no per-test attribution and consolidation is outcome-blind, so
      # one failing roll's trajectory would enter the shared store and -- since
      # write-misses replays hits -- reproduce the same failure on every rerun
      # until a prompt change rotates its keys. Discarding the whole shard's
      # diff costs one re-roll of its passing tests; a poisoned entry costs a
      # key rotation. Logs still upload on failure below -- they are how a bad
      # roll gets diagnosed.
      if: success() && inputs.cache_mode == 'write-misses'
      uses: actions/upload-artifact@v4
      with:
        name: cache-diff-${{ github.run_id }}-${{ steps.normalize-path.outputs.test_path_normalized }}
        path: .cache_write.ndjson
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 7

    - name: Stop local orchestra
      if: always()
      continue-on-error: true
      run: orchestra/scripts/local.sh stop || true

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: protected-llm-logs-${{ github.run_id }}-${{ steps.normalize-path.outputs.test_path_normalized }}
        path: logs/
        if-no-files-found: ignore
        retention-days: 7

  export-cache:
    name: Export shared cache artifact
    runs-on: ubuntu-latest
    needs: [validate, discover]
    if: inputs.test_path == 'EXPORT_CACHE'
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore shared .cache.ndjson
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    - name: Verify restored cache
      run: |
        test -f .cache.ndjson || { echo "No .cache.ndjson restored" >&2; exit 1; }
        echo "Entry count: $(grep -c . .cache.ndjson || true)"
        ls -lh .cache.ndjson

    - name: Analyze cache size composition
      run: |
        python3 - <<'PY'
        import json, re, statistics
        from collections import Counter

        path = ".cache.ndjson"
        IMAGE_MARKERS = (
            "data:image/",
            '"type": "image_url"',
            '"type":"image_url"',
            "image/png",
            "image/jpeg",
            "image/webp",
        )
        # long base64-ish runs (URL-safe + std)
        B64_RUN = re.compile(r"[A-Za-z0-9+/_-]{200,}")

        rows = []
        with open(path, "r", encoding="utf-8") as fh:
            for i, line in enumerate(fh, 1):
                if not line.strip():
                    continue
                total = len(line.encode("utf-8"))
                try:
                    obj = json.loads(line)
                except Exception as e:
                    rows.append({"i": i, "total": total, "err": str(e)})
                    continue
                key = obj.get("key") or ""
                val = obj.get("value") or ""
                if not isinstance(key, str):
                    key = json.dumps(key)
                if not isinstance(val, str):
                    val = json.dumps(val)
                key_b = len(key.encode("utf-8"))
                val_b = len(val.encode("utf-8"))
                blob = key + "\n" + val
                has_image_marker = any(m in blob for m in IMAGE_MARKERS)
                b64_spans = B64_RUN.findall(blob)
                b64_bytes = sum(len(s) for s in b64_spans)
                rows.append(
                    {
                        "i": i,
                        "total": total,
                        "key": key_b,
                        "val": val_b,
                        "img": has_image_marker,
                        "b64": b64_bytes,
                        "b64_spans": len(b64_spans),
                        "key_prefix": key[:80],
                    }
                )

        n = len(rows)
        tot = sum(r["total"] for r in rows)
        key_tot = sum(r.get("key", 0) for r in rows)
        val_tot = sum(r.get("val", 0) for r in rows)
        img_rows = [r for r in rows if r.get("img")]
        img_bytes = sum(r["total"] for r in img_rows)
        b64_bytes = sum(r.get("b64", 0) for r in rows)
        # entries where long b64 spans are a large share of the line
        heavy_b64 = [r for r in rows if r.get("b64", 0) >= 0.5 * r["total"] and r["total"] > 50_000]

        def pct(x):
            return 100.0 * x / tot if tot else 0.0

        print(f"entries={n}")
        print(f"total_bytes={tot} ({tot/1e9:.3f} GB)")
        print(f"key_bytes={key_tot} ({pct(key_tot):.1f}%)")
        print(f"value_bytes={val_tot} ({pct(val_tot):.1f}%)")
        print(f"avg_entry_bytes={tot/n:.0f}" if n else "avg=0")
        sizes = sorted(r["total"] for r in rows)
        if sizes:
            def q(p):
                idx = min(len(sizes)-1, int(p * (len(sizes)-1)))
                return sizes[idx]
            print(f"p50={q(0.5)} p90={q(0.9)} p95={q(0.95)} p99={q(0.99)} max={sizes[-1]}")
        print(f"entries_with_image_markers={len(img_rows)} ({100*len(img_rows)/n:.1f}%) bytes={img_bytes} ({pct(img_bytes):.1f}%)")
        print(f"sum_long_base64_span_bytes={b64_bytes} ({pct(b64_bytes):.1f}% of file)")
        print(f"entries_majority_long_base64={len(heavy_b64)} bytes={sum(r['total'] for r in heavy_b64)} ({pct(sum(r['total'] for r in heavy_b64)):.1f}%)")

        # top 15 largest
        print("\nTOP_15_LARGEST:")
        for r in sorted(rows, key=lambda x: x["total"], reverse=True)[:15]:
            print(
                f"  bytes={r['total']} key={r.get('key',0)} val={r.get('val',0)} "
                f"img={r.get('img')} b64_span_bytes={r.get('b64',0)} "
                f"prefix={r.get('key_prefix','')!r}"
            )

        # size histogram buckets
        buckets = Counter()
        for r in rows:
            b = r["total"]
            if b < 10_000:
                buckets["<10KB"] += 1
            elif b < 100_000:
                buckets["10-100KB"] += 1
            elif b < 500_000:
                buckets["100-500KB"] += 1
            elif b < 1_000_000:
                buckets["0.5-1MB"] += 1
            elif b < 5_000_000:
                buckets["1-5MB"] += 1
            else:
                buckets[">=5MB"] += 1
        print("\nSIZE_BUCKETS:")
        for k in ["<10KB", "10-100KB", "100-500KB", "0.5-1MB", "1-5MB", ">=5MB"]:
            print(f"  {k}: {buckets[k]}")
        PY

    - name: Upload .cache.ndjson for local sync
      if: ${{ inputs.parallel_run_args != 'SKIP_UPLOAD' }}
      uses: actions/upload-artifact@v4
      with:
        name: cache-ndjson-upstream
        path: .cache.ndjson
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
        include-hidden-files: true

  consolidate:
    name: Consolidate and store cache
    runs-on: ubuntu-latest
    needs: [validate, discover, refresh]
    if: always() && needs.validate.result == 'success' && inputs.cache_mode == 'write-misses' && inputs.test_path != 'EXPORT_CACHE'
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Resolve cache-diff source run
      id: src
      shell: bash
      env:
        # Free-form dispatch input: see the validate job above.
        TEST_PATH_INPUT: ${{ inputs.test_path }}
      run: |
        TEST_PATH="$TEST_PATH_INPUT"
        if [[ "$TEST_PATH" == CONSOLIDATE_FROM:* ]]; then
          RUN_ID="${TEST_PATH#CONSOLIDATE_FROM:}"
        else
          RUN_ID="${{ github.run_id }}"
        fi
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "pattern=cache-diff-${RUN_ID}-*" >> "$GITHUB_OUTPUT"
        echo "Using cache-diff artifacts from run $RUN_ID"

    - name: Restore existing consolidated cache
      id: cache-read
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    # Consolidation merges onto whatever this job restored, so hydrating first
    # is what stops a refresh from *shrinking* the store. On 29 July one
    # restored nothing, merged its own 52 entries, and published that over a
    # 9586-entry history.
    # Staged as a diff and merged, not restored on a miss. The artifact is a
    # separate lineage from the branch-scoped Actions cache, and this job
    # republishes it: restoring 52 entries from a branch and uploading those as
    # the newest artifact would shadow a far larger one, which is the same
    # most-recently-created trap the Actions cache has. Merging makes what this
    # job publishes a superset of both, so the upload is always safe to make.
    - name: Stage the cross-branch artifact for consolidation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p cache-artifacts/upstream
        .github/scripts/hydrate_llm_cache.sh cache-artifacts/upstream/.cache_write.ndjson

    - name: Download cache diffs from matrix shards
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ steps.src.outputs.pattern }}
        path: cache-artifacts
        merge-multiple: false
        repository: ${{ github.repository }}
        run-id: ${{ steps.src.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Consolidate .cache.ndjson
      id: consolidate
      run: |
        # grep -c prints 0 and exits 1 on an empty file, and prints nothing at
        # all when the file is missing, so neither case may abort the step.
        entries() { local n; n=$(grep -c . "$1" 2>/dev/null || true); echo "${n:-0}"; }
        restored=$(entries .cache.ndjson)
        # Decided here rather than in the step conditions so that dying before
        # the comparison leaves both answers at "do not publish".
        echo "publish=false" >> "$GITHUB_OUTPUT"
        echo "has_entries=false" >> "$GITHUB_OUTPUT"
        python3 .github/scripts/consolidate_cache.py --artifacts-dir cache-artifacts
        # actions/cache/save fails if the path is absent.
        touch .cache.ndjson
        merged=$(entries .cache.ndjson)
        if (( merged > restored )); then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi
        if (( merged > 0 )); then
          echo "has_entries=true" >> "$GITHUB_OUTPUT"
        fi
        echo "Consolidated entry count: $merged (restored $restored)"
        ls -lh .cache.ndjson

    # A refresh that bought nothing must not publish: the entry would be newer
    # than the store it was built from, and restore-keys resolves the shared
    # cache-ndjson- prefix to the most recently created match.
    - name: Store consolidated cache
      if: steps.consolidate.outputs.publish == 'true'
      uses: actions/cache/save@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The store only leaves this branch as an artifact: the Actions entry above
    # is branch-scoped, so a promotion PR into main cannot restore it. Retention
    # is also the ceiling on how long the store survives with no refresh, since
    # nothing else outlives eviction.
    #
    # Gated on having entries rather than on growth, unlike the Actions save.
    # The upstream artifact was merged in above, so this store is a superset of
    # the newest one and cannot shadow it -- and requiring growth would mean a
    # repo with no artifact yet never published a first one, because a refresh
    # that hits every key grows nothing.
    - name: Publish the cross-branch LLM cache artifact
      if: steps.consolidate.outputs.has_entries == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: llm-cache-ndjson
        path: .cache.ndjson
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
