name: Flow Smoke
run-name: >-
  ${{
    github.event_name == 'push' && 'Flow smoke (commit)' ||
    'Flow smoke (manual)'
  }}

# Ad-hoc/manual runner for the live flow smoke suite, plus the cancel-latency
# diagnostics below. Live end-to-end smoke of the core product flows in
# tests/flows drives the real Unity brain through a local Orchestra, so every
# run makes paid LLM calls and cannot be cache-replayed: the brain embeds
# fresh per-run identifiers (task/log/context ids, timestamps) in later-turn
# prompts, so read-only cache replay misses and fails. That is why the flows
# must live here on a dedicated spend-acknowledged trigger rather than in the
# normal read-only Tests matrix (the Tests discover job blocks tests/flows
# for the same reason).
#
# The staging -> main release gate lives in a separate workflow,
# flow-smoke-release-gate.yml, which only triggers on pull_request(main) or
# workflow_dispatch. It must stay separate: GitHub Actions publishes a
# "skipped" check run for a job whose `if` evaluates false, and a skipped
# required check is satisfied the same as a pass, so a gate job living in a
# workflow that also triggers on push would attach a stale passing
# "Flow smoke" to every ordinary commit -- letting a release PR merge on that
# stale pass before the real pull_request-triggered run for the same SHA
# finishes. Keeping the gate out of any push-triggered workflow means an
# ordinary push produces no check run under that context at all.
#
# Triggers here: a [run-flows] marker on any push, and manual dispatch
# (LLM_SPEND_OK acknowledged, or CANCEL_SMOKE_OK for the diagnostics below).

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Session timeout"
        required: false
        type: number
        default: 30
      confirm_llm_spend:
        description: "LLM_SPEND_OK for live flows; CANCEL_SMOKE_OK for cancel-latency diagnostics (no LLM)"
        required: true
        type: string
  push:
    branches:
    - '**'

permissions:
  contents: read
  # Reading the cross-branch llm-cache-ndjson artifact.
  actions: read

# Debouncer semantics: a running smoke completes; only the pending slot is
# replaced.
concurrency:
  group: flow-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Cancel-latency diagnostics (no LLM). Dispatch with confirm_llm_spend=
  # CANCEL_SMOKE_OK. Uses this workflow because it already exists on main
  # (required for workflow_dispatch) and has a concurrency group independent
  # of the Tests matrix — so hung Tests runs cannot block these experiments.
  # ---------------------------------------------------------------------------
  cancel-smoke-A:
    name: "A: baseline sleep"
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_llm_spend == 'CANCEL_SMOKE_OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Hang
      run: |
        set -u
        echo "SMOKE_A start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        while true; do
          echo "SMOKE_A heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 10
        done

  cancel-smoke-B:
    name: "B: tmux wait, no trap"
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_llm_spend == 'CANCEL_SMOKE_OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Hang
      run: |
        set -u
        echo "SMOKE_B start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tmux new-session -d -s smoke_b "bash -c 'while true; do echo tmux_b \$(date -u +%H:%M:%S); sleep 10; done'"
        while tmux has-session -t smoke_b 2>/dev/null; do
          echo "SMOKE_B heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 5
        done
        echo "SMOKE_B session ended unexpectedly"

  cancel-smoke-C:
    name: "C: tmux + kill-server trap"
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_llm_spend == 'CANCEL_SMOKE_OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Hang
      run: |
        set -u
        cleanup() {
          echo "SMOKE_C caught signal $(date -u +%Y-%m-%dT%H:%M:%SZ) — kill-server"
          tmux kill-server 2>/dev/null || true
          exit 143
        }
        trap cleanup INT TERM
        echo "SMOKE_C start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tmux new-session -d -s smoke_c "bash -c 'while true; do echo tmux_c \$(date -u +%H:%M:%S); sleep 10; done'"
        while tmux has-session -t smoke_c 2>/dev/null; do
          echo "SMOKE_C heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 5
        done
        echo "SMOKE_C session ended unexpectedly"

  cancel-smoke-D:
    name: "D: parallel_run-style trap"
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_llm_spend == 'CANCEL_SMOKE_OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Hang
      run: |
        set -u
        cleanup() {
          local sig="${1:-TERM}"
          echo "SMOKE_D caught signal ${sig} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tmux list-panes -t smoke_d -F '#{pane_pid}' 2>/dev/null | while read -r pid; do
            if [[ -n "$pid" ]]; then
              kill -TERM "-$pid" 2>/dev/null || true
            fi
          done
          sleep 0.1
          tmux kill-session -t smoke_d 2>/dev/null || true
          echo "SMOKE_D cleanup complete $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit 143
        }
        trap 'cleanup INT' INT
        trap 'cleanup TERM' TERM
        echo "SMOKE_D start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tmux new-session -d -s smoke_d "bash -c 'while true; do echo tmux_d \$(date -u +%H:%M:%S); sleep 10; done'"
        while tmux has-session -t smoke_d 2>/dev/null; do
          echo "SMOKE_D heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 5
        done
        echo "SMOKE_D session ended unexpectedly"

  cancel-smoke-E:
    name: "E: always() 120s after hang"
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_llm_spend == 'CANCEL_SMOKE_OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Hang
      run: |
        set -u
        echo "SMOKE_E hang start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        while true; do
          echo "SMOKE_E heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 10
        done
    - name: Slow always cleanup
      if: always()
      run: |
        echo "SMOKE_E always-start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        sleep 120
        echo "SMOKE_E always-done $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - name: Cancel-only cleanup
      if: cancelled()
      run: echo "SMOKE_E cancelled-cleanup $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  flows:
    name: Flow smoke (run)
    runs-on: ubuntu-latest-8-cores
    environment: unity-testing
    timeout-minutes: 60
    # Run on: manual LLM_SPEND_OK dispatch, or a [run-flows] push.
    # CANCEL_SMOKE_OK dispatches are handled by the cancel-smoke-* jobs above.
    # The staging -> main PR case runs from flow-smoke-release-gate.yml instead.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.confirm_llm_spend == 'LLM_SPEND_OK') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-flows]'))
    env:
      UNIFY_TESTS_RAND_PROJ: "false"
      UNIFY_TESTS_DELETE_PROJ_ON_START: "false"
      UNIFY_TESTS_DELETE_PROJ_ON_EXIT: "false"
      # Read-write, never read-only: a miss must fall through to a live call and
      # be recorded, not fail the gate. Hit rates start low because the brain
      # embeds per-run values (wall-clock "[Now: ...]", task/log/context ids) in
      # later-turn prompts, and only entries whose whole request matches replay.
      UNILLM_CACHE: "true"
      ORCHESTRA_REPO_PATH: ${{ github.workspace }}/orchestra
      ORCHESTRA_URL: ${{ vars.ORCHESTRA_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_CI_API_KEY }}
      # The brain (unillm) routes LLM calls through OpenRouter; without this the
      # slow-brain turns fail with a 401 "No cookie auth credentials found" and
      # no reply lands.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      # Orchestra routes embeddings (embed() derived logs / Builtins seeding)
      # through OpenRouter, so the CI-local Orchestra needs this key too.
      ORCHESTRA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CI_API_KEY }}
      # Brain default model is gpt-5.6-sol@openai (OpenAI). OPENAI_API_KEY
      # above covers slow-brain auth; DEEPSEEK remains for DeepSeek-specific tests.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_CI_API_KEY }}
      # UNIFY_COMMS_URL stays unset: it keeps the in-process
      # LocalActivationScheduler on and outbound comms off the hosted
      # Communication service (see unify/task_scheduler/settings.py).
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      ORCHESTRA_GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_LOGS }}
      ORCHESTRA_GCP_ASSISTANT_MEDIA_BUCKET_NAME: ${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}
      ORCHESTRA_GCP_ASSISTANT_CALL_RECORDINGS_BUCKET_NAME: ${{ vars.GCP_BUCKET_RECORDINGS }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      UNIFY_KEY: ${{ secrets.UNIFY_KEY }}
      # The Builtins project is reserved (admin-key-only) in Orchestra. The
      # fresh CI-local Orchestra (host uvicorn, inherits this env) adopts this
      # as its admin key, and the test Builtins seed uses the same value so it
      # can create/converge the reserved project. Local-only throwaway key.
      ORCHESTRA_ADMIN_KEY: local-admin-key
      PYTHONPATH: ${{ github.workspace }}/unillm:${{ github.workspace }}/unisdk
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Acknowledge LLM spend (manual runs)
      if: github.event_name == 'workflow_dispatch'
      env:
        # Free-form dispatch input; compare it as data, not as script text.
        CONFIRM_LLM_SPEND: ${{ inputs.confirm_llm_spend }}
      run: |
        if [[ "$CONFIRM_LLM_SPEND" != "LLM_SPEND_OK" ]]; then
          echo "Refusing live flow smoke: confirm_llm_spend must be LLM_SPEND_OK" >&2
          exit 1
        fi

    # Mints an installation token that can read orchestra and nothing
    # else, then revokes it when the job ends. 4606137 is the
    # unifyai-ci-clone App, which holds Contents: Read only; an App id is
    # not a secret.
    - name: Mint a token that can read orchestra
      id: clone-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: '4606137'
        private-key: ${{ secrets.CI_CLONE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: orchestra

    - name: Clone orchestra repo for local deployment
      uses: actions/checkout@v6
      with:
        repository: unifyai/orchestra
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: orchestra
        token: ${{ steps.clone-token.outputs.token }}
        fetch-depth: 1

    - name: Clone unify repo
      uses: actions/checkout@v6
      with:
        repository: unifyai/unisdk
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unisdk
        fetch-depth: 1

    - name: Clone unillm repo
      uses: actions/checkout@v6
      with:
        repository: unifyai/unillm
        ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
        path: unillm
        fetch-depth: 1

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    - name: Get orchestra commit SHA
      id: orchestra-sha
      run: echo "sha=$(git -C orchestra rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install apt packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          tmux zsh portaudio19-dev libnss3-dev libatk-bridge2.0-dev libdrm2 \
          libxkbcommon0 libgtk-3-dev libgbm-dev libgirepository1.0-dev \
          libasound2t64 libatspi2.0-0 libgtk-3-0 libnspr4 libwayland-client0 \
          libxcomposite1 libxdamage1 libxrandr2 xvfb

    - name: Install uv
      run: |
        pip install uv

    # Download cache only, never .venv — see the note in tests.yml. Both
    # workflows write this key, so they have to agree on what it holds.
    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-v2-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'unillm/pyproject.toml', 'unisdk/pyproject.toml') }}
        restore-keys: |
          uv-v2-${{ runner.os }}-

    # Same store the Tests matrix reads and the LLM cache refresh writes, so a
    # flow run replays anything those already paid for.
    - name: Restore .cache.ndjson
      id: cache-read
      uses: actions/cache/restore@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cache-ndjson-${{ runner.os }}-

    # This gate runs as a pull_request with base=main, which cannot restore an
    # entry saved on staging, so without the cross-branch artifact the flows
    # replay nothing and re-buy every completion.
    - name: Hydrate .cache.ndjson from the cross-branch artifact
      if: steps.cache-read.outputs.cache-matched-key == ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: .github/scripts/hydrate_llm_cache.sh

    - name: Configure unify/unillm paths for CI
      run: |
        # The checked-out dependency repos live in the workflow workspace, so
        # point uv at those paths instead of refetching Git sources.
        python3 <<'PY'
        from pathlib import Path

        pyproject = Path("pyproject.toml")
        text = pyproject.read_text()
        replacements = {
            'unisdk = { git = "https://github.com/unifyai/unisdk.git", branch = "staging" }': 'unisdk = { path = "./unisdk", editable = true }',
            'unillm = { git = "https://github.com/unifyai/unillm.git", branch = "staging" }': 'unillm = { path = "./unillm", editable = true }',
            'unisdk = { path = "../unisdk", editable = true }': 'unisdk = { path = "./unisdk", editable = true }',
            'unillm = { path = "../unillm", editable = true }': 'unillm = { path = "./unillm", editable = true }',
        }
        for old, new in replacements.items():
            text = text.replace(old, new)
        pyproject.write_text(text)

        unillm_pyproject = Path("unillm/pyproject.toml")
        text = unillm_pyproject.read_text()
        text = text.replace(
            'unisdk = { git = "https://github.com/unifyai/unisdk.git", branch = "staging" }',
            'unisdk = { path = "../unisdk", editable = true }',
        )
        unillm_pyproject.write_text(text)
        PY

    - name: Sync dependencies with uv
      run: uv sync --all-groups

    - name: Cache Playwright assets
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright assets
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: uv run playwright install --with-deps

    - name: Cache orchestra virtualenv
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/orchestra/.venv
        key: uv-orchestra-${{ runner.os }}-${{ steps.orchestra-sha.outputs.sha }}
        restore-keys: |
          uv-orchestra-${{ runner.os }}-

    - name: Install orchestra dependencies
      run: |
        cd "$ORCHESTRA_REPO_PATH"
        uv sync --frozen

    - name: Run flow smoke
      id: run-tests
      env:
        TIMEOUT_MINUTES_INPUT: ${{ inputs.timeout_minutes || 30 }}
      run: |
        set +e
        TIMEOUT=$(( ${TIMEOUT_MINUTES_INPUT:-30} * 60 ))

        # xvfb-run swallows signals; start Xvfb directly so cancellation
        # reaches parallel_run.sh.
        Xvfb :99 -screen 0 1920x1080x24 &
        XVFB_PID=$!
        export DISPLAY=:99
        trap "kill $XVFB_PID 2>/dev/null" EXIT

        echo "Running flow smoke with UNILLM_CACHE=$UNILLM_CACHE"
        tests/parallel_run.sh --timeout "$TIMEOUT" tests/flows
        TEST_EXIT_CODE=$?
        echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit $TEST_EXIT_CODE

    # Fold each session's misses back into the shared store so the next run
    # replays them. Runs even when the smoke fails: completions bought before
    # the failing turn are still worth keeping.
    - name: Consolidate flow session caches
      id: consolidate
      if: always()
      run: |
        # grep -c prints 0 and exits 1 on an empty file, and prints nothing at
        # all when the file is missing, so neither case may abort the step.
        entries() { local n; n=$(grep -c . "$1" 2>/dev/null || true); echo "${n:-0}"; }
        restored=$(entries .cache.ndjson)
        # Decided here rather than in the step condition so that dying before
        # the comparison leaves the answer at "do not publish".
        echo "publish=false" >> "$GITHUB_OUTPUT"
        python3 .github/scripts/consolidate_cache.py --artifacts-dir .flow-cache
        # actions/cache/save fails if the path is absent.
        touch .cache.ndjson
        merged=$(entries .cache.ndjson)
        if (( merged > restored )); then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi
        echo "Consolidated entry count: $merged (restored $restored)"
        ls -lh .cache.ndjson

    # Publishing a store that did not grow mints a newer entry under the shared
    # cache-ndjson- prefix while adding no completions. restore-keys resolves a
    # prefix to the most recently created match, so such an entry shadows the
    # real cache for every later Tests and flow run, and each run then republishes
    # what it just shadowed.
    - name: Store consolidated cache
      if: always() && steps.consolidate.outputs.publish == 'true'
      uses: actions/cache/save@v4
      with:
        path: .cache.ndjson
        key: cache-ndjson-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    # This job deliberately does not publish llm-cache-ndjson. Readers resolve
    # that name to the most recently created one, so a publisher whose store is
    # not a superset of the current artifact shadows it -- and this job's store
    # is whatever its own branch happened to restore. Only the refresh merges
    # the upstream artifact back in, so only the refresh can publish safely.
    # What this gate buys still reaches the Actions cache above, and the next
    # refresh folds it onward from there.

    - name: Stop local orchestra
      if: always()
      continue-on-error: true
      run: orchestra/scripts/local.sh stop || true

    - name: Collect orchestra server log
      if: always()
      continue-on-error: true
      # Server-side tracebacks (logger.exception in request handlers) exist
      # only here; without this file a backend programming error is reduced to
      # whatever one-line detail reached the client.
      run: cp /tmp/orchestra-local-server.log logs/orchestra-server.log || true

    - name: Upload flow smoke logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flow-smoke-logs-${{ github.run_id }}
        path: logs/
        if-no-files-found: ignore
        retention-days: 14
